# Core service settings. Values that differ per environment come from
# environment variables; the defaults below are for local development only.
spring:
  application:
    name: core-service

  # Non-blocking connection used by the application (DL-02).
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shelfwise}
    username: ${DB_USER:shelfwise}
    password: ${DB_PASSWORD:shelfwise}

  # Flyway runs db/migration/V*.sql once at start-up over JDBC, then is idle.
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shelfwise}
    user: ${DB_USER:shelfwise}
    password: ${DB_PASSWORD:shelfwise}

  # Errors are returned as standard JSON problem details (RFC 9457).
  webflux:
    problemdetails:
      enabled: true
    # Uploads are read one part at a time; a part over this size is refused while it streams (the invoice limit is 20 MB).
    multipart:
      max-in-memory-size: 1MB
      max-disk-usage-per-part: 21MB
      max-parts: 4

shelfwise:
  auth:
    # Signing key for access tokens. The default is for LOCAL DEVELOPMENT ONLY;
    # every deployed environment must set JWT_SECRET (at least 32 characters).
    jwt-secret: ${JWT_SECRET:local-development-only-secret-do-not-use-elsewhere}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  import:
    # When true, the provided data files are imported on start-up. Re-runs only add new records (D28).
    enabled: ${IMPORT_ON_STARTUP:false}
    data-dir: ${IMPORT_DATA_DIR:../data}
    # Starting password given to imported users (D25). Required when importing; never logged.
    demo-password: ${DEMO_PASSWORD:}

  messaging:
    # RabbitMQ (DL-03). The default is the local docker-compose broker; deployed environments set RABBITMQ_URI.
    rabbit-uri: ${RABBITMQ_URI:amqp://guest:guest@localhost:5672}
    exchange: shelfwise.events
    # Publishes the outbox to RabbitMQ. Off in tests that don't need a broker.
    relay-enabled: ${OUTBOX_RELAY_ENABLED:true}
    relay-interval: 2s
    batch-size: 100

  storage:
    # S3-compatible file storage for supplier invoices (DL-04). Defaults are the local SeaweedFS in docker-compose;
    # deployed environments (Cloudflare R2) set STORAGE_* variables, and the keys must never be committed.
    endpoint: ${STORAGE_ENDPOINT:http://localhost:8333}
    region: ${STORAGE_REGION:us-east-1}
    bucket: ${STORAGE_BUCKET:shelfwise-invoices}
    access-key: ${STORAGE_ACCESS_KEY:local-dev-access}
    secret-key: ${STORAGE_SECRET_KEY:local-dev-secret}
    path-style: ${STORAGE_PATH_STYLE:true}

  cors:
    # Other browser origins allowed to call the API, comma-separated. Empty = none (phones don't need it).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

  jobs:
    # Nightly jobs (M23), IST. Spring cron: second minute hour day month weekday; "-" switches a job off.
    enabled: ${JOBS_ENABLED:true}
    expire-drafts-cron: ${JOBS_EXPIRE_DRAFTS_CRON:0 30 1 * * *}
    low-stock-cron: ${JOBS_LOW_STOCK_CRON:0 45 1 * * *}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true   # /actuator/health/liveness and /readiness for containers
