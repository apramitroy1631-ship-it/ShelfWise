# CI for the notification service only.
# Runs when the notification service (or the backend's shared build settings) changes,
# never because of web/, mobile/ or the core service (decision DL-08).
name: backend-notification

on:
  push:
    paths:
      - "backend/notification-service/**"
      - "backend/pom.xml"
      - "backend/.mvn/**"
      - "backend/mvnw"
      - ".github/workflows/backend-notification.yml"
  pull_request:
    paths:
      - "backend/notification-service/**"
      - "backend/pom.xml"
      - "backend/.mvn/**"
      - "backend/mvnw"
      - ".github/workflows/backend-notification.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test notification service
        run: ./mvnw -B -pl notification-service -am verify
