# ShelfWise: everything for local development with one command.
#
#   docker compose up -d --build
#
# The passwords below are LOCAL DEVELOPMENT defaults only; real environments set their own.
# File storage is SeaweedFS (S3-compatible, DL-04); invoices go in the bucket the core service creates on first use.
name: shelfwise

services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: ${DB_NAME:-shelfwise}
      POSTGRES_USER: ${DB_USER:-shelfwise}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-shelfwise}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-management
    ports:
      - "5672:5672"     # messaging (core service -> notification service, DL-03)
      - "15672:15672"   # management UI: http://localhost:15672 (guest / guest, local only)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    # Single-node server with the S3 API on 8333. Local development only (no access control).
    command: server -dir=/data -s3
    ports:
      - "8333:8333"
    volumes:
      - seaweeddata:/data

  core-service:
    build:
      context: ./backend
      dockerfile: core-service/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-shelfwise}
      DB_USER: ${DB_USER:-shelfwise}
      DB_PASSWORD: ${DB_PASSWORD:-shelfwise}
      # Import the provided data on start-up; re-runs only add new records (D28).
      IMPORT_ON_STARTUP: "true"
      IMPORT_DATA_DIR: /data
      # Shared demo starting password for imported users (D25). Local/demo only.
      DEMO_PASSWORD: ${DEMO_PASSWORD:-ShelfWise-Demo-2026}
      # Signs access tokens; the notification service checks them with the SAME key.
      JWT_SECRET: ${JWT_SECRET:-local-development-only-secret-do-not-use-elsewhere}
      # The outbox relay publishes events here (DL-03). If RabbitMQ is down, events wait in the outbox.
      RABBITMQ_URI: amqp://guest:guest@rabbitmq:5672
      # Supplier invoices (DL-04). Deployed environments point these at Cloudflare R2.
      STORAGE_ENDPOINT: http://seaweedfs:8333
    volumes:
      - ./data:/data:ro   # the provided dataset, read-only
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started

  notification-service:
    build:
      context: ./backend
      dockerfile: notification-service/Dockerfile
    environment:
      # Own 'notifications' schema in the same PostgreSQL server (DL-12).
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-shelfwise}
      DB_USER: ${DB_USER:-shelfwise}
      DB_PASSWORD: ${DB_PASSWORD:-shelfwise}
      JWT_SECRET: ${JWT_SECRET:-local-development-only-secret-do-not-use-elsewhere}
      RABBITMQ_URI: amqp://guest:guest@rabbitmq:5672
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
  seaweeddata:
