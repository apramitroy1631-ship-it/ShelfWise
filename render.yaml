# Render blueprint (M30): the three services, built from this repository's Dockerfiles. See docs/deploy.md.
# In Render: New -> Blueprint -> pick this repository. Render asks for every value marked "sync: false"
# (secrets and addresses of the database, the broker and the file storage); nothing secret is stored here.
#
# Free plan: each service has 512 MB, sleeps after 15 idle minutes and takes a few minutes to wake (DL-07).
# Free services can't use Render's private network, so the web service forwards /api to the public addresses.

services:
  # --- core service: API, import on start-up, outbox relay, nightly jobs ---------------------------------
  - type: web
    name: shelfwise-core
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/core-service/Dockerfile
    dockerContext: .                      # repository root: the image includes data/ for the import
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: PORT                         # tells Render which port the service listens on
        value: 8080
      - key: DB_HOST                      # Neon: the DIRECT host (not the "-pooler" one)
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_MODE
        value: require
      - key: JWT_SECRET                   # generated once; the notification service copies it from here
        generateValue: true
      - key: DEMO_PASSWORD                # starting password of the imported demo accounts (D25)
        sync: false
      - key: IMPORT_ON_STARTUP            # re-runs only add new records (D28)
        value: "true"
      - key: RABBITMQ_URI                 # CloudAMQP: the amqps:// URL
        sync: false
      - key: STORAGE_ENDPOINT             # Cloudflare R2: https://<account-id>.r2.cloudflarestorage.com
        sync: false
      - key: STORAGE_REGION
        value: auto
      - key: STORAGE_BUCKET
        value: shelfwise-invoices
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS         # the web address; without it the browser's sign-in gets 403
        fromService:
          type: web
          name: shelfwise-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: LOGGING_STRUCTURED_FORMAT_CONSOLE   # JSON log lines (DL-14)
        value: ecs

  # --- notification service: consumes events, serves the bell ---------------------------------------------
  - type: web
    name: shelfwise-notifications
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/notification-service/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: PORT
        value: 8081
      - key: DB_HOST                      # same database; own 'notifications' schema (DL-12)
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_MODE
        value: require
      - key: JWT_SECRET                   # must equal the core service's
        fromService:
          type: web
          name: shelfwise-core
          envVarKey: JWT_SECRET
      - key: RABBITMQ_URI
        sync: false
      - key: LOGGING_STRUCTURED_FORMAT_CONSOLE
        value: ecs

  # --- web app: nginx serves the built app and forwards /api to the two services ---------------------------
  - type: web
    name: shelfwise-web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./web/Dockerfile
    dockerContext: ./web
    healthCheckPath: /
    envVars:
      - key: CORE_URL
        fromService:
          type: web
          name: shelfwise-core
          envVarKey: RENDER_EXTERNAL_URL
      - key: NOTIFICATIONS_URL
        fromService:
          type: web
          name: shelfwise-notifications
          envVarKey: RENDER_EXTERNAL_URL
